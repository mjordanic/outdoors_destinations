# Cloud Build config for the web image, submitted by .github/workflows/deploy.yml
# (docs/deploy.md, section 9). It builds web/Dockerfile on top of the data image, so only
# the code layers are new.
#
#   gcloud builds submit --config web/cloudbuild.yaml \
#     --substitutions _IMAGE=REPO/web:SHA,_DATA_IMAGE=REPO/data:FACTS_VERSION .
steps:
  - name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --file=web/Dockerfile
      - --build-arg=DATA_IMAGE=${_DATA_IMAGE}
      - --tag=${_IMAGE}
      - .
images: [$_IMAGE]
timeout: 1800s
