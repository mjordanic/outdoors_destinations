# The French schema_randonnee datasets of data.gouv.fr examined for ADR-0062, one
# table each. `id` is the sources register id (docs/sources.csv, where the used
# ones carry their licence and the rest their reason); `short` the name an
# unnamed record is shown with; `page` the dataset's page; `file` its
# schema_randonnee GeoJSON (the schema is https://github.com/PnX-SI/schema_randonnee);
# `licence` the licence code data.gouv.fr publishes for it. `dayhike
# fetch-external --source fr` caches each dataset whose licence the gate accepts
# (FR_LICENCES in external.py) and whose file follows the schema, and says why it
# skips the others.

[[dataset]]
id = "fr-ecrins-randonnees"
short = "Écrins"
page = "https://www.data.gouv.fr/fr/datasets/5bf88cf28b4c4151e7a136d2/"
file = "https://data.ecrins-parcnational.fr/files/randos_pne_schema.geojson"
licence = "lov2"

