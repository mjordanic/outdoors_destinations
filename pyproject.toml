[project]
name = "dayhike"
version = "0.1.0"
description = "Local Catalog of DayHikes from OpenStreetMap"
requires-python = ">=3.13"
dependencies = [
    "osmium>=4.3.1",
    "rasterio>=1.5.1",
    "scikit-learn>=1.9.1",
    "shapely>=2.1.2",
]

[project.scripts]
dayhike = "dayhike.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "contextily>=1.7.1",
    "fastapi>=0.162.0",
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: needs local Europe data (DAYHIKE_REAL_DATA=1)"]
