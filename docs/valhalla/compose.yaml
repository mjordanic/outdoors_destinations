services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - "8002:8002"
    volumes:
      # Place a regional PBF here. The running service answers
      # POST /sources_to_targets for DriveTime. Do not use /isochrone as a
      # Catalog or Ranking filter.
      - ../../data/valhalla:/custom_files
