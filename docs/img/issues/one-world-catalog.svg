<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="One world catalog: a hike in England finds similar hikes in the US, and each hike shows its own emergency number">
  <title>One worldwide site and catalog</title>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a24}.m{fill:#5d6b62}.h{font-weight:700;fill:#245f3c}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
  <rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
  <text x="20" y="26" class="h" font-size="16">One site, one catalog: "hikes like this one" can answer on another continent</text>
  <!-- US blob -->
  <path d="M40 80 C 90 55, 250 55, 330 75 C 360 110, 350 170, 300 200 C 230 225, 120 215, 70 190 C 35 160, 25 110, 40 80 z" fill="#e8f1eb" stroke="#bcd8c4"/>
  <text x="140" y="100" font-weight="700" fill="#245f3c">United States</text>
  <!-- Europe blob -->
  <path d="M560 70 C 620 50, 760 55, 840 80 C 870 120, 850 190, 790 210 C 710 230, 620 215, 580 185 C 545 150, 540 100, 560 70 z" fill="#e8f1eb" stroke="#bcd8c4"/>
  <text x="680" y="92" font-weight="700" fill="#245f3c">Europe</text>
  <!-- seed -->
  <circle cx="610" cy="130" r="9" fill="#c2410c"/>
  <text x="625" y="126" font-size="12" font-weight="700">Seed: a ridge walk</text>
  <text x="625" y="141" font-size="12">in the Lake District</text>
  <!-- matches -->
  <g fill="#2f7d4f"><circle cx="150" cy="150" r="7"/><circle cx="185" cy="135" r="7"/><circle cx="270" cy="160" r="7"/><circle cx="720" cy="160" r="7"/><circle cx="760" cy="125" r="7"/></g>
  <path d="M598 132 C 480 110, 360 120, 282 155" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="380" y="84" font-size="12" class="m">same length, climb,</text>
  <text x="380" y="99" font-size="12" class="m">land cover, climate</text>
  <text x="120" y="178" font-size="12">matches in Colorado and Utah</text>
  <!-- panels -->
  <rect x="40" y="235" width="380" height="80" rx="8" fill="#fff4ec" stroke="#f3d3bd"/>
  <text x="55" y="258" font-weight="700" font-size="13">Hike panel, a US hike</text>
  <text x="55" y="280" font-size="12">Emergency: <tspan font-weight="700">911</tspan> · units in miles and feet by default</text>
  <text x="55" y="300" font-size="12" class="m">number chosen from the hike's own start point, not the site</text>
  <rect x="480" y="235" width="400" height="80" rx="8" fill="#fff4ec" stroke="#f3d3bd"/>
  <text x="495" y="258" font-weight="700" font-size="13">Hike panel, a hike in England</text>
  <text x="495" y="280" font-size="12">Emergency: <tspan font-weight="700">999 or 112</tspan>, ask for Police, then Mountain Rescue</text>
  <text x="495" y="300" font-size="12" class="m">a hike in Croatia would say 112 and name HGSS</text>
</svg>
